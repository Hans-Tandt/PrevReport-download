name: "Bewertung (Deutsch)"
description: "Ihre Meinung macht das Programm besser · etwa 15 Minuten"
title: "[Bewertung] "
labels: ["evaluation"]
body:
  - type: markdown
    attributes:
      value: "> [!CAUTION]\n> **Schreiben Sie nie einen Namen** — Issues auf GitHub sind öffentlich: Jeder kann sie lesen. Schreiben Sie nie Namen von Personen oder Ihres Unternehmens und keine vertraulichen Daten. Schreiben Sie stattdessen „ein Beschäftigter“, „der Standort“, „Einheit 3“."
  - type: markdown
    attributes:
      value: "## Warum Ihre Meinung zählt\n\nPrevReport wurde auf Grundlage der amtlichen Formulare und Regeln gebaut. Aber Sie benutzen es, an echten Standorten, für echte Berichte. Nur der echte Einsatz zeigt, was langsam, unklar, fehlend — oder falsch ist.\n\n- Jede Antwort wird vom Ersteller des Programms, Hans Tandt, gelesen.\n- Die vereinbarten Änderungen kommen in die nächste Version.\n- Das Programm zeigt Ihnen, wenn diese Version da ist: Oben erscheint eine goldene Schaltfläche „Neue Version“.\n\n> [!NOTE]\n> **Eine falsche Regel wiegt am schwersten** — Der Bericht geht an den Ausschuss (AGSA, CSE oder ASA), und die Inspektion kann ihn prüfen. Ist eine Regel, eine Kennzahl oder ein Wort für Ihr Land falsch, sagen Sie es uns — mit Dokument und Artikel."
  - type: markdown
    attributes:
      value: "Beantworten Sie nur, was Sie benutzt haben. Lassen Sie den Rest leer.\n\nGeben Sie eine Note von 1 bis 5: 1 = sehr schlecht, 3 = annehmbar, 5 = sehr gut.\n\nDieselben Fragen als PDF / Word: Ordner `Evaluation` dieses Repositorys."
  - type: markdown
    attributes:
      value: "## Über Sie"
  - type: dropdown
    id: q01
    attributes:
      label: "Land Ihres Bereichs (Ihrer Bereiche)"
      options:
        - "Belgien"
        - "Frankreich"
        - "Deutschland"
        - "anderes"
    validations:
      required: false
  - type: dropdown
    id: q02
