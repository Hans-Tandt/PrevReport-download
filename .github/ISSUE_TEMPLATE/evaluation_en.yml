name: "Evaluation (English)"
description: "Your opinion makes the app better · about 15 minutes"
title: "[Evaluation] "
labels: ["evaluation"]
body:
  - type: markdown
    attributes:
      value: "> [!CAUTION]\n> **Never write a name** — Issues on GitHub are public: everybody can read them. Never write the names of people or of your company, and no confidential data. Write “a worker”, “the site”, “unit 3” instead."
  - type: markdown
    attributes:
      value: "## Why your opinion matters\n\nPrevReport was built from the official forms and rules. But you use it, on real sites, for real reports. Only real use shows what is slow, unclear, missing — or wrong.\n\n- Every answer is read by the creator of the app, Hans Tandt.\n- The changes agreed on go into the next version.\n- The app tells you when that version is there: a gold “New version” button appears at the top.\n\n> [!NOTE]\n> **A wrong rule counts most** — The report goes to the committee (CPPT, CSE or ASA) and the inspection can check it. If a rule, a rate or a word is wrong for your country, tell us — with the document and article."
  - type: markdown
    attributes:
      value: "Answer only what you used. Leave the rest empty.\n\nGive a score from 1 to 5: 1 = very bad, 3 = acceptable, 5 = very good.\n\nThe same questions as a PDF / Word document: folder `Evaluation` of this repository."
  - type: markdown
    attributes:
      value: "## About you"
