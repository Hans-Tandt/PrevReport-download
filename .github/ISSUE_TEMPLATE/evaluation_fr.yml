name: "Évaluation (français)"
description: "Votre avis rend l’application meilleure · environ 15 minutes"
title: "[Évaluation] "
labels: ["evaluation"]
body:
  - type: markdown
    attributes:
      value: "> [!CAUTION]\n> **N’écrivez jamais un nom** — Les issues sur GitHub sont publiques : tout le monde peut les lire. N’écrivez jamais le nom d’une personne ou de votre entreprise, ni aucune donnée confidentielle. Écrivez plutôt « un travailleur », « le site », « l’unité 3 »."
  - type: markdown
    attributes:
      value: "## Pourquoi votre avis compte\n\nPrevReport a été construit à partir des formulaires et des règles officiels. Mais c’est vous qui l’utilisez, sur de vrais sites, pour de vrais rapports. Seul l’usage réel montre ce qui est lent, pas clair, manquant — ou faux.\n\n- Chaque réponse est lue par le créateur de l’application, Hans Tandt.\n- Les changements retenus entrent dans la prochaine version.\n- L’application vous prévient quand cette version est là : un bouton doré « Nouvelle version » apparaît en haut.\n\n> [!NOTE]\n> **Une règle fausse compte le plus** — Le rapport va au comité (CPPT, CSE ou ASA) et l’inspection peut le contrôler. Si une règle, un taux ou un mot est faux pour votre pays, dites-le — avec le document et l’article."
  - type: markdown
    attributes:
      value: "Répondez seulement à ce que vous avez utilisé. Laissez le reste vide.\n\nDonnez une note de 1 à 5 : 1 = très mauvais, 3 = acceptable, 5 = très bon.\n\nLes mêmes questions en PDF / Word : dossier `Evaluation` de ce dépôt."
