name: "Evaluatie (Nederlands)"
description: "Uw mening maakt de toepassing beter · ongeveer 15 minuten"
title: "[Evaluatie] "
labels: ["evaluation"]
body:
  - type: markdown
    attributes:
      value: "> [!CAUTION]\n> **Schrijf nooit een naam** — Issues op GitHub zijn openbaar: iedereen kan ze lezen. Schrijf nooit namen van personen of van uw bedrijf, en geen vertrouwelijke gegevens. Schrijf liever “een werknemer”, “de site”, “eenheid 3”."
  - type: markdown
    attributes:
      value: "## Waarom uw mening telt\n\nPrevReport is gebouwd op basis van de officiële formulieren en regels. Maar u gebruikt het, op echte sites, voor echte verslagen. Alleen echt gebruik toont wat traag, onduidelijk, ontbrekend — of fout is.\n\n- Elk antwoord wordt gelezen door de maker van de toepassing, Hans Tandt.\n- De afgesproken wijzigingen komen in de volgende versie.\n- De toepassing laat u weten wanneer die versie er is: bovenaan verschijnt een goudkleurige knop “Nieuwe versie”.\n\n> [!NOTE]\n> **Een foute regel telt het zwaarst** — Het verslag gaat naar het comité (CPBW, CSE of ASA) en de inspectie kan het nakijken. Is een regel, een graad of een woord fout voor uw land, meld het ons — met het document en het artikel."
  - type: markdown
    attributes:
      value: "Beantwoord alleen wat u gebruikt hebt. Laat de rest leeg.\n\nGeef een score van 1 tot 5: 1 = zeer slecht, 3 = aanvaardbaar, 5 = zeer goed.\n\nDezelfde vragen als pdf / Word: map `Evaluation` van deze repository."
